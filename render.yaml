# Render Blueprint: one web service with a 1 GB disk (~$7.25/month).
# Data lives in one SQLite file on the disk; Render snapshots the disk daily.
services:
  - type: web
    name: songroom
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/songroom.db
    disk:
      name: songroom-data
      mountPath: /var/data
      sizeGB: 1

