# Render Blueprint: one web service + one Postgres database (~$13/month).
services:
  - type: web
    name: songroom
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: APP_PASSWORD
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: songroom-db
          property: connectionString

databases:
  - name: songroom-db
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "17"
